name: CI

# Orchestration only; the steps live in .ci/ci_jobs.sh so they can be read,
# linted and run without pushing a commit to find out.
#
# Actions are referenced by release tag, not commit SHA. A tag is mutable, so
# this is a readability trade: the ones used here are all first-party
# actions/*, and the tools that decide what actually gets tested and shipped
# are pinned in .ci/consts.sh instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # On a pull request this is the merge commit, which is what checkout gives us.
  CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Static checks
        run: ./.ci/ci_jobs.sh do_static_checks

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-static-checks
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  build:
    name: build (${{ matrix.arch }})
    needs: static-checks
    # Native runners, matched OS versions, so the processor is the only
    # deliberate difference. A manifest listing two platforms is not evidence
    # that either one boots.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build
        run: ./.ci/ci_jobs.sh do_build_image

      # Everything downstream works from this tarball, so the image that gets
      # scanned, tested and published is one build rather than three.
      - name: Upload image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: .ci-artifacts/image-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  scan:
    name: scan (${{ matrix.arch }})
    needs: build
    # Both architectures find the same things, since the binary is static
    # and the distroless base has no arch-specific packages. Kept as a matrix
    # anyway: it scans what it publishes, and it runs alongside e2e so no added time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        run: ./.ci/ci_jobs.sh do_setup_tools trivy

      - name: Download image
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.arch }}
          path: .ci-artifacts

      - name: Scan
        run: ./.ci/ci_jobs.sh do_scan_image

      # Also on failure, which is when the report is worth reading.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-scan-${{ matrix.arch }}
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: e2e (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        run: ./.ci/ci_jobs.sh do_setup_tools kind kubectl

      - name: Download image
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.arch }}
          path: .ci-artifacts

      - name: Kubernetes end-to-end
        run: ./.ci/ci_jobs.sh do_k8s_e2e

      - name: Diagnostics
        if: failure()
        run: ./.ci/ci_jobs.sh do_diagnostics

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-e2e-${{ matrix.arch }}
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Publish
    # Both gates, both architectures. The scan is what keeps an unapproved
    # HIGH or CRITICAL finding out of the registry.
    needs: [scan, e2e]
    # The only job that can write to the registry. github.repository stops a
    # fork's own main from trying to publish here.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'shahar-spormas/echo-pong'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download tested images
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: .ci-artifacts

      - name: Publish
        env:
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.ci/ci_jobs.sh do_publish_image

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-publish
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  verify-published:
    name: Verify published image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify
        env:
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.ci/ci_jobs.sh do_verify_published

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-verify-published
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn
