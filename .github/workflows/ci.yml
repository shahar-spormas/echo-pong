name: CI

# Orchestration only; the steps are in .ci/ci_jobs.sh, so they can be run and
# linted without pushing a commit.
#
# Actions use release tags, not commit SHAs: a readability trade, since these
# are all first-party actions/* and the tools that decide what gets tested and
# shipped are pinned in .ci/consts.sh.

on:
  pull_request:
  push:
    branches: [main]
    # A release runs the whole pipeline again rather than re-tagging what main
    # published: the same gates, then the tag itself as the image version.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # On a pull request, the merge commit, which is what checkout gives us.
  CI_COMMIT_SHA: ${{ github.sha }}
  # Set only for a tag push, where it becomes the image version and has to
  # agree with the VERSION file. Empty elsewhere, giving v<VERSION>-<sha>.
  CI_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The linters diff against the base, absent in a shallow clone.
          fetch-depth: 0

      # Read from CI_ARCHES in .ci/consts.sh, so adding an architecture needs
      # no change here and no copy of the list per job.
      - name: Resolve the architecture matrix
        id: matrix
        run: echo "value=$(./.ci/ci_jobs.sh do_print_matrix)" >> "$GITHUB_OUTPUT"

      # PRs lint their diff; a push to main leaves this unset and sweeps all.
      - name: Static checks
        env:
          CI_LINT_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./.ci/ci_jobs.sh do_static_checks

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-static-checks
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  build:
    name: build (${{ matrix.arch }})
    needs: static-checks
    # Native runners, matched OS versions, so the processor is the only
    # difference. A manifest listing two platforms is not evidence either boots.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static-checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build
        run: ./.ci/ci_jobs.sh do_build_image

      # Taken from the image, so a released binary is the tested executable.
      - name: Extract binary
        run: ./.ci/ci_jobs.sh do_extract_binary

      # Everything downstream works from this tarball: one build, not three.
      - name: Upload image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: .ci-artifacts/image-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: .ci-artifacts/ping-pong-app-linux-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error

  scan:
    name: scan (${{ matrix.arch }})
    needs: [static-checks, build]
    # Both find the same things today: static binary, no arch-specific packages
    # in the base. Kept a matrix anyway; it scans what it publishes, for free.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static-checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        run: ./.ci/ci_jobs.sh do_setup_tools trivy

      - name: Download image
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.arch }}
          path: .ci-artifacts

      - name: Scan
        run: ./.ci/ci_jobs.sh do_scan_image

      # Also on failure, when the report is worth reading.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-scan-${{ matrix.arch }}
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: e2e (${{ matrix.arch }})
    needs: [static-checks, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static-checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        run: ./.ci/ci_jobs.sh do_setup_tools kind kubectl

      - name: Download image
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.arch }}
          path: .ci-artifacts

      - name: Kubernetes end-to-end
        run: ./.ci/ci_jobs.sh do_k8s_e2e

      - name: Diagnostics
        if: failure()
        run: ./.ci/ci_jobs.sh do_diagnostics

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-e2e-${{ matrix.arch }}
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Publish
    # Both gates, both architectures: this is what keeps an unapproved
    # HIGH or CRITICAL finding out of the registry.
    needs: [scan, e2e]
    # Tags only. Publishing from main as well meant every release was built,
    # scanned, tested and pushed twice for the same commit, once as a snapshot
    # and again under the tag. github.repository stops a fork publishing here.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'shahar-spormas/echo-pong'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download tested images
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: .ci-artifacts

      - name: Publish
        env:
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.ci/ci_jobs.sh do_publish_image

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-publish
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  verify-published:
    name: Verify published image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify
        env:
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.ci/ci_jobs.sh do_verify_published

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-verify-published
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn

  release:
    name: GitHub Release
    # Only for a tag, and only once the image it names is published and pulled,
    # so the release cannot point at something that failed verification.
    needs: verify-published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Generated notes compare against the previous tag.
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: .ci-artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.ci/ci_jobs.sh do_github_release

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: report-release
          path: .ci-artifacts/reports/
          retention-days: 7
          if-no-files-found: warn
